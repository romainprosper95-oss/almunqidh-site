<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Almunqidh | Premiers Secours Suisse</title>
</head>
<body>
    <header class="container" style="padding: 20px 0;">
        <nav style="display:flex; justify-content:space-between; align-items:center;">
            <a href="index.html" style="font-weight:800; font-size:1.5rem;">ALMUNQIDH</a>
            <div style="display:flex; gap:20px;">
                <a href="index.html">Accueil</a>
                <a href="formations.html">Formations</a>
                <a href="materiel.html">Matériel</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section style="text-align:center; padding: 60px 0;">
            <h1 style="font-size: 3.5rem; margin-bottom: 20px;">L'excellence du secourisme.</h1>
            <p style="font-size: 1.2rem; color: #666;">Formations certifiées et matériel de pointe en Suisse.</p>
        </section>

        <!-- Bande Impact -->
        <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 60px;">
            <div class="card-premium">
                <h3 id="accident-count" style="font-size: 2.5rem; color: #D52B1E;">0</h3>
                <p>Urgences secourues cette année</p>
            </div>
            <div class="card-premium" style="background-color: #D52B1E; color: white;">
                <h3 id="save-count" style="font-size: 2.5rem; color: white;">0</h3>
                <p>Vies sauvées grâce aux DAE</p>
            </div>
        </section>
    </main>

    <script>
        function animateCount(id, endValue, duration) {
            let start = 0;
            let obj = document.getElementById(id);
            let stepTime = Math.abs(Math.floor(duration / endValue));
            let timer = setInterval(() => {
                start += 1;
                obj.innerHTML = start.toLocaleString('fr-CH');
                if (start >= endValue) clearInterval(timer);
            }, stepTime);
        }
        window.onload = () => { animateCount("accident-count", 1248, 2000); animateCount("save-count", 84, 2000); };
    </script>
</body>
</html>
